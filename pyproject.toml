[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pi-experiment-harness"
version = "0.1.0"
description = "Reproducible experiment harness for Pi coding agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2,<7",
]

[project.scripts]
piexp = "pi_experiments.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pi_experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
